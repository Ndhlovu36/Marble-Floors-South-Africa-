<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Marble Floors SA - Pay with Pi</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
</head>
<body>
<h1>My Products</h1>
<p>Price: 1 Pi</p>
<p id="userInfo" style="color:green;font-weight:bold"></p>

<button onclick="loginWithPi()">Login with Pi</button>
<button id="payWithPi">Pay with Pi</button>

<div style="margin-top:30px">
<p>© 2026 MARBLE FLOORS SOUTH AFRICA</p>
<p><a href="legal.html">Privacy</a> | <a href="terms.html">Terms</a> | <a href="report.html">Support</a></p>
<p>Email: marblefloorssa@gmail.com</p>
<p>CA | Johannesburg | Cape Town | Bloemfontein | Luxury Floors</p>
</div>

<script>
const Pi = window.Pi;
Pi.init({ version: "2.0", sandbox: false });
let user = null;
function onIncomplete(p){ console.log(p); }
async function loginWithPi(){
 try{
  const a = await Pi.authenticate(['username','payments'], onIncomplete);
  user = a.user;
  document.getElementById('userInfo').innerText = "Welcome "+user.username+" ✅ Pi Connected - Ready to Order";
 }catch(e){ alert("Please open in Pi Browser: "+e.message); }
}
async function payWithPi(item){
 if(!user){ alert("Please Login with Pi first"); return; }
 try{
  await Pi.createPayment({
   amount: 1, memo: "Marble Floor "+item, metadata:{item:item},
   onReadyForServerApproval: async(id)=>{},
   onReadyForServerCompletion: async(id,txid)=>{ alert("Paid! "+txid); },
   onCancel: ()=> alert("Cancelled"),
   onError: (e)=> alert(e.message)
  });
 }catch(e){ alert(e.message); }
}
document.getElementById('payWithPi').onclick = ()=> payWithPi('Site Quote');
</script>
</body>
</html>
