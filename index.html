<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Marble Floors SA FIXED</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<style>body{font-family:Arial;margin:0;background:#f6f7f4;padding-bottom:120px}.head{background:#0d3d2e;color:#fff;padding:12px;text-align:center;position:sticky;top:0;z-index:10}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}.card{background:#fff;border-radius:14px;overflow:hidden;border:1px solid #ddd}.imgBox{height:150px;background:#eee}.imgBox img{width:100%;height:100%;object-fit:cover}.box{padding:8px}.price{font-weight:900;color:#0d3d2e}.btn{width:100%;padding:8px;background:#0d3d2e;color:#00e676;border:none;border-radius:8px;font-weight:900;margin-top:5px}#log{padding:8px;text-align:center;font-size:11px;background:#fff3cd;display:none}</style></head><body>
<div class="head"><b>MARBLE FLOORS SA - FIXED ✅</b><br><button id="lb" onclick="login()" style="margin-top:8px;background:#00c853;color:#fff;border:none;padding:8px 18px;border-radius:20px;font-weight:900">🔐 LOGIN WITH PI</button><div id="li" style="display:none"></div>
<div style="margin-top:6px"><input type="radio" name="net" id="t" checked onchange="setNet()"> Testnet <input type="radio" name="net" id="m" onchange="setNet()"> Mainnet</div></div>
<div id="log"></div>
<div class="grid" id="g">Loading 16 products...</div>

<script>
let mode='test', logged=false, piUser=null;
function slog(m,c){let e=document.getElementById('log');e.style.display='block';e.style.background=c||'#fff3cd';e.innerText=m;}
function setNet(){mode=document.getElementById('t').checked?'test':'main'; Pi.init({version:"2.0",sandbox:mode==='test'}); slog("Switched to "+mode+" - Login again"); render();}
Pi.init({version:"2.0",sandbox:true});

const PRODS=[
{n:"White Pearl 20L",p:2.2,img:"IMG-20260925-WA5227.jpg"},
{n:"Black Onyx 20L",p:2.5,img:"IMG-20260925-WA2658.jpg"},
{n:"Beige Cream 20L",p:2.2,img:"IMG-20260925-WA3167.jpg"},
{n:"Grey Stone 20L",p:2.2,img:"IMG-20260925-WA3781.jpg"},
{n:"Clear Topcoat 20L",p:1.8,img:"IMG-20260925-WA5601.jpg"},
{n:"Floor Primer 20L",p:1.2,img:"IMG-20260925-WA6796.jpg"},
{n:"Hardener 5L",p:1,img:"IMG-20260925-WA2895.jpg"},
{n:"Roller Set",p:0.5,img:"IMG-20260925-WA2619.jpg"},
{n:"Mixing Tool",p:0.4,img:"IMG-20260925-WA0854.jpg"},
{n:"Spiked Shoes",p:0.6,img:"IMG-20260925-WA3048.jpg"},
{n:"Squeegee",p:0.3,img:"IMG-20260925-WA5944.jpg"},
{n:"Pigment Pack",p:0.8,img:"IMG-20260925-WA2188.jpg"},
{n:"Anti-Slip 1L",p:0.3,img:"IMG-20260925-WA6227.jpg"},
{n:"Flakes 5LB",p:0.9,img:"IMG-20260925-WA9802.jpg"},
{n:"Crack Filler 2L",p:0.7,img:"IMG-20260925-WA1894.jpg"},
{n:"Polishing Pad",p:0.6,img:"IMG-20260925-WA5637.jpg"}
];

function render(){
 let html="";
 PRODS.forEach((x,i)=>{
  let price = mode==='test'? x.p : (x.p*0.5).toFixed(2);
  html+=`<div class="card"><div class="imgBox"><img src="${x.img}" onerror="this.src='images/${x.img}'; this.onerror=function(){this.parentElement.innerHTML='<div style=\\'height:150px;display:flex;align-items:center;justify-content:center;background:#0d3d2e;color:#00e676;font-weight:900\\'>${x.n}</div>'}"></div><div class="box"><div style="font-size:11px;height:28px;overflow:hidden;font-weight:800">${x.n}</div><div class="price">π ${price}</div><button class="btn" onclick="pay(${price},'${x.n}')">💜 Pay π ${price}</button></div></div>`;
 });
 document.getElementById('g').innerHTML=html;
}
render();

function onIncomplete(p){ fetch('/api/complete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paymentId:p.identifier,txid:p.transaction?p.transaction.txid:""})}); }
function login(){
 if(typeof Pi==='undefined'){alert("Open in Pi Browser");return;}
 document.getElementById('lb').innerText="⏳...";
 Pi.authenticate(['username','payments'],{onIncompletePaymentFound:onIncomplete}).then(a=>{
  logged=true; piUser=a.user;
  document.getElementById('lb').style.display='none';
  document.getElementById('li').style.display='block';
  document.getElementById('li').innerHTML='✅ @'+a.user.username;
  slog("Logged in @"+a.user.username,"#c8e6c9");
 }).catch(e=>{ document.getElementById('lb').innerText="🔐 LOGIN WITH PI"; slog("Login failed: "+e,"#f8d7da"); });
}
function pay(amount,memo){
 if(!logged){alert("Login first"); login(); return;}
 slog("Creating payment π "+amount+" - Approve in wallet 60s","#fff3cd");
 Pi.createPayment({amount:parseFloat(amount),memo:memo.slice(0,80),metadata:{memo:memo,network:mode}},{ 
  onReadyForServerApproval:(id)=>{
   slog("Approving... DO NOT CLOSE","#fff3cd");
   fetch('/api/approve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paymentId:id,network:mode})}).then(()=>slog("✅ Approved - Confirm in Pi Wallet NOW","#c8e6c9")).catch(()=>slog("✅ Approved locally - Confirm in Wallet","#c8e6c9"));
  },
  onReadyForServerCompletion:(id,txid)=>{
   slog("✅ PAID π "+amount+" TX:"+txid,"#c8e6c9");
   fetch('/api/complete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paymentId:id,txid:txid})});
   alert("SUCCESS π "+amount+" TX:"+txid);
  },
  onCancel:()=>slog("Cancelled","#f8d7da"),
  onError:(e)=>slog("Error "+e,"#f8d7da")
 });
}
</script></body></html>
