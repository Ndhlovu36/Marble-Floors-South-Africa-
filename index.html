<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Marble Floors SA - 16 Products Pi Only</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<style>
*{box-sizing:border-box}body{font-family:Arial;margin:0;background:#f6f7f4;padding-bottom:70px}
.top{padding:14px 16px;background:#fff;position:sticky;top:0;z-index:10;border-bottom:1px solid #e0e0e0}
.top h1{margin:0;font-size:22px;color:#1a1a1a}.top p{margin:4px 0 0 0;color:#666;font-size:13px}
.search{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid #d9e2d0;border-radius:24px;padding:10px 16px;margin:12px 16px}
.search input{border:none;outline:none;flex:1;font-size:14px}
.filters{display:flex;gap:8px;padding:0 16px;overflow-x:auto}.f{padding:8px 18px;border-radius:20px;border:1px solid #d0d0d0;background:#fff;font-size:13px;font-weight:600;white-space:nowrap;cursor:pointer}.f.active{background:#0d3d2e;color:#fff;border-color:#0d3d2e}
.count{padding:12px 16px;color:#666;font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 10px}
.card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.08);position:relative;border:1px solid #eef2e8}
.imgBox{height:140px;background:#eee;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}.imgBox img{width:100%;height:100%;object-fit:cover;display:block}
.badge{position:absolute;top:8px;right:8px;background:#0d5c3d;color:#fff;padding:4px 10px;border-radius:12px;font-size:12px;font-weight:800}
.card-body{padding:10px}.title{font-size:11px;font-weight:800;color:#1a1a1a;line-height:1.2;height:32px;overflow:hidden}.desc{font-size:10px;color:#777;margin-top:4px;height:28px;overflow:hidden;line-height:1.3}
.priceRow{margin-top:8px;display:flex;align-items:center;gap:6px}.price{color:#0d5c3d;font-weight:900;font-size:14px}.stock{background:#e6f4ea;color:#0d5c3d;padding:3px 10px;border-radius:12px;font-size:10px;font-weight:700}
.btn-pi{background:#0d3d2e;color:#00e676;width:100%;padding:9px;border:1px solid #00c853;border-radius:8px;font-weight:900;margin-top:8px;cursor:pointer;font-size:11px}
.btn-wa{background:#f1f8f1;color:#0d3d2e;width:100%;padding:7px;border:1px solid #c8e6c9;border-radius:8px;font-weight:700;margin-top:5px;cursor:pointer;font-size:10px}
.headerPi{background:#0d3d2e;color:#fff;padding:12px;text-align:center}.btn-login{background:#00c853;color:#fff;border:none;padding:10px 20px;border-radius:25px;font-weight:900;cursor:pointer}
#piLog{padding:8px;text-align:center;font-size:11px;font-weight:bold;display:none}.tabs{display:flex;justify-content:center;gap:8px;padding:8px;background:#0d3d2e}.tab{padding:5px 12px;border-radius:20px;font-size:11px;font-weight:900;cursor:pointer;border:1px solid #00c853;background:transparent;color:#00c853}.tab.active{background:#00c853;color:#fff}
.bottomNav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e0e0e0;display:flex;justify-content:space-around;padding:8px 0;z-index:20}.bottomNav div{text-align:center;font-size:11px;color:#666}.bottomNav .active{color:#0d5c3d;font-weight:900}
</style></head><body>
<div class="headerPi"><div style="font-weight:900;">MARBLE FLOORS SOUTH AFRICA - 16 Pi Only</div><div style="margin-top:8px;"><button class="btn-login" id="lb" onclick="login()">🔐 LOGIN WITH PI</button><div id="li" style="display:none;"></div><div id="st" style="font-size:10px;color:#a5d6a7;margin-top:4px;">Login to pay with Pi - No Fiat</div></div><div class="tabs"><button class="tab active" id="tTest" onclick="setMode('test')">🟡 TESTNET</button><button class="tab" id="tMain" onclick="setMode('main')">🟢 MAINNET</button></div></div>
<div id="piLog"></div>
<div class="top"><h1>Product catalog - 16 Products</h1><p>Epoxy marble coatings, primers, hardeners and tools. Pi Only - No ZAR - Images Fixed</p></div>
<div class="search"><span>🔍</span><input id="search" placeholder="Search 16 products..." oninput="filterSearch()"></div>
<div class="filters"><button class="f active" onclick="filterCat('All',this)">All</button><button class="f" onclick="filterCat('Coating',this)">Coatings</button><button class="f" onclick="filterCat('Primer',this)">Primers</button><button class="f" onclick="filterCat('Tools',this)">Tools</button><button class="f" onclick="filterCat('20L',this)">20L</button></div>
<div class="count" id="count">16 products - π Pi Only - No R - Images Fixed</div>
<div class="grid" id="g"></div>
<div class="bottomNav"><div><div>⌂</div>Home</div><div class="active"><div>⊞</div>Products</div><div><div>☰</div>Requests</div></div>
<script>
let piUser=null,logged=false,mode='test',allProducts=[];
const logEl=document.getElementById('piLog');
function showLog(m,c){logEl.style.display='block';logEl.style.background=c||'#fff3cd';logEl.innerText=m;}
function setMode(m){mode=m;document.getElementById('tTest').classList.toggle('active',m==='test');document.getElementById('tMain').classList.toggle('active',m==='main');initPi();}
function initPi(){try{if(typeof Pi!=='undefined'){Pi.init({version:"2.0",sandbox:(mode==='test')});showLog(`✅ Pi ${mode.toUpperCase()} - 16 Products Ready`,"#e8f5e9");}}catch(e){}}
setTimeout(initPi,700);
function login(){if(typeof Pi==='undefined'){alert("Open in Pi Browser");return;}showLog("⏳ Approve Login...","#fff9c4");Pi.authenticate(['username','payments'],()=>{}).then(a=>{logged=true;piUser=a.user;document.getElementById('lb').style.display='none';document.getElementById('li').style.display='block';document.getElementById('li').innerHTML='<span style="background:#2e7d32;color:#fff;padding:5px 12px;border-radius:20px;font-weight:900;font-size:12px;">✅ @'+a.user.username+'</span>';showLog(`✅ Welcome @${a.user.username}`,"#c8e6c9");}).catch(e=>{showLog(`❌ ${e.message}`,"#ffebee");});}

const P=[
{n:"Epoxy Marble - White Pearl 20L",p:12,d:"High-gloss white pearl",c:"Coating",img:"IMG-20260925-WA5227.jpg",on:"https://images.unsplash.com/photo-1581858726788-75bc0f6a952d?w=500"},
{n:"Epoxy Marble - Black Onyx 20L",p:13,d:"Deep black onyx luxury",c:"Coating",img:"IMG-20260925-WA2658.jpg",on:"https://images.unsplash.com/photo-1618221195710-dd6b41faaea6?w=500"},
{n:"Epoxy Marble - Beige Cream 20L",p:12,d:"Warm beige cream finish",c:"Coating",img:"IMG-20260925-WA3167.jpg",on:"https://images.unsplash.com/photo-1600585154340-be6161a56a0c?w=500"},
{n:"Stone Coat Grey Marble 20L",p:12,d:"Grey stone marble effect",c:"Coating",img:"IMG-20260925-WA3781.jpg",on:"https://images.unsplash.com/photo-1615529182904-14819c35db37?w=500"},
{n:"Clear Epoxy Topcoat 20L",p:11,d:"Crystal-clear topcoat",c:"Coating",img:"IMG-20260925-WA5601.jpg",on:"https://images.unsplash.com/photo-1581091226825-a6a2a5aee158?w=500"},
{n:"Concrete Floor Primer 20L",p:9,d:"Primer was R2100 now Pi 9",c:"Primer",img:"IMG-20260925-WA6796.jpg",on:"https://images.unsplash.com/photo-1513694203232-719a280e022f?w=500"},
{n:"Epoxy Hardener 5L",p:6,d:"Hardener was R1450 Pi 6",c:"Primer",img:"IMG-20260925-WA2895.jpg",on:"https://images.unsplash.com/photo-1581092160562-40aa08e78837?w=500"},
{n:"Epoxy Roller Set",p:2,d:"Roller was R380 Pi 2",c:"Tools",img:"IMG-20260925-WA2629.jpg",on:"https://images.unsplash.com/photo-1562259949-e8e7689d7828?w=500"},
{n:"Mixing Tool & Paddle",p:1.5,d:"Paddle was R290 Pi 1.5",c:"Tools",img:"IMG-20260925-WA0854.jpg",on:"https://images.unsplash.com/photo-1504148455328-c376907d081c?w=500"},
{n:"Spiked Shoes Pair",p:1.8,d:"Shoes was R340 Pi 1.8",c:"Tools",img:"IMG-20260925-WA3048.jpg",on:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500"},
{n:"Notched Squeegee",p:1.2,d:"Professional squeegee",c:"Tools",img:"IMG-20260925-WA5944.jpg",on:"https://images.unsplash.com/photo-1581147036324-c17ac41dfa3c?w=500"},
{n:"Metallic Pigment Pack",p:3,d:"5 colors gold silver",c:"Tools",img:"IMG-20260925-WA2188.jpg",on:"https://images.unsplash.com/photo-1513364776144-60967b0f800f?w=500"},
{n:"Anti-Slip Additive 1L",p:1,d:"Anti-slip safety",c:"Tools",img:"IMG-20260925-WA6227.jpg",on:"https://images.unsplash.com/photo-1581091226825-a6a2a5aee158?w=500"},
{n:"Decorative Flakes 5LB",p:4,d:"Multicolor flakes",c:"Tools",img:"IMG-20260925-WA9802.jpg",on:"https://images.unsplash.com/photo-1615529182904-14819c35db37?w=500"},
{n:"Epoxy Crack Filler 2L",p:3.5,d:"Crack repair kit",c:"Tools",img:"IMG-20260925-WA1894.jpg",on:"https://images.unsplash.com/photo-1581092160562-40aa08e78837?w=500"},
{n:"Polishing Pad 3000 Grit",p:2.5,d:"High-gloss polishing",c:"Tools",img:"IMG-20260925-WA5637.jpg",on:"https://images.unsplash.com/photo-1504148455328-c376907d081c?w=500"}
];
allProducts=P;
function render(list){
 document.getElementById('count').innerText=`${list.length} products - π Pi Only - No Fiat`;
 document.getElementById('g').innerHTML=list.map(x=>`<div class="card"><div class="imgBox"><img src="./images/${x.img}" alt="${x.n}" onerror="this.onerror=null;this.src='${x.on}'"><div class="badge">π ${x.p}</div></div><div class="card-body"><div class="title">${x.n}</div><div class="desc">${x.d}</div><div class="priceRow"><span class="price">π ${x.p} Pi</span><span class="stock">In stock</span></div><div style="font-size:8px;color:#0d5c3d;font-weight:700;margin-top:3px;">Pi Only No R - ${x.img}</div><button class="btn-pi" onclick="payPi('${x.n}',${x.p})">💜 Pay π ${x.p} Pi</button><button class="btn-wa" onclick="window.open('https://wa.me/27607263726?text=${encodeURIComponent(x.n)}%20π%20${x.p}','_blank')">💬 WhatsApp</button></div></div>`).join('');
}
render(P);
function filterCat(cat,el){document.querySelectorAll('.f').forEach(b=>b.classList.remove('active'));el.classList.add('active');if(cat==='All')render(P);else render(P.filter(p=>p.n.toLowerCase().includes(cat.toLowerCase())||p.c.toLowerCase().includes(cat.toLowerCase())));}
function filterSearch(){let q=document.getElementById('search').value.toLowerCase();render(P.filter(p=>p.n.toLowerCase().includes(q)));}
function payPi(name,price){if(!logged){alert("Tap LOGIN WITH PI first!");return;}showLog(`⏳ Creating π ${price}...`,"#fff9c4");Pi.createPayment({amount:price,memo:`Marble ${name} Pi Only`,metadata:{product:name}},{
 onReadyForServerApproval:function(id){fetch('/api/approve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paymentId:id})}).then(()=>showLog(`✅ Approved π ${price}! Wallet`,"#e8f5e9")).catch(()=>showLog(`✅ Approved Test π ${price}`,"#e8f5e9"));},
 onReadyForServerCompletion:function(id,txid){showLog(`✅ PAID π ${price}! ${txid}`,"#c8e6c9");fetch('/api/complete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paymentId:id,txid})}).catch(()=>{});let msg=`MARBLE PAID π ${price}%0A${name}%0ATXID ${txid}%0A@${piUser.username}`;setTimeout(()=>{window.open('https://wa.me/27607263726?text='+msg,'_blank');},700);},
 onCancel:function(){showLog(`❌ Cancelled`,"#ffebee");},onError:function(e){showLog(`❌ ${e.message}`,"#ffebee");}
});}
</script></body></html>
