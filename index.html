<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Marble Floors SA - Pi Only - FIXED LOGIN</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<style>body{font-family:Arial;margin:0;background:#f6f7f4;padding-bottom:120px}.head{background:#0d3d2e;color:#fff;padding:12px;text-align:center;position:sticky;top:0;z-index:10}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}.card{background:#fff;border-radius:14px;overflow:hidden;border:1px solid #ddd}.imgBox{height:150px;background:#eee}.imgBox img{width:100%;height:100%;object-fit:cover}.box{padding:8px}.price{font-weight:900;color:#0d3d2e}.btn{width:100%;padding:8px;background:#0d3d2e;color:#00e676;border:none;border-radius:8px;font-weight:900;margin-top:5px}#log{padding:10px;text-align:center;font-size:12px;font-weight:bold;display:none;position:sticky;top:60px;z-index:20}.panel{background:#fff;margin:12px;border-radius:14px;padding:12px;border:1px solid #ddd}.field{margin-bottom:8px}.field input,.field textarea{width:100%;padding:10px;border:1px solid #c8e6c9;border-radius:8px;box-sizing:border-box}</style></head><body>
<div class="head"><b>MARBLE FLOORS SA - FIXED ✅</b><br>
<button id="lb" onclick="login()" style="margin-top:8px;background:#00c853;color:#fff;border:none;padding:8px 18px;border-radius:20px;font-weight:900">🔐 LOGIN WITH PI</button>
<div id="li" style="display:none;background:#00e676;color:#000;padding:6px;border-radius:20px;font-weight:900;margin-top:8px"></div>
<div style="margin-top:6px;font-size:12px"><input type="radio" name="net" id="t" checked onchange="setNet()"> Testnet <input type="radio" name="net" id="m" onchange="setNet()"> Mainnet</div>
<div id="piStatus" style="font-size:11px;color:#00e676;margin-top:4px">Init Pi...</div>
</div>
<div id="log"></div>
<div class="grid" id="g">Loading...</div>

<div class="panel"><h3 style="margin:0 0 8px 0;font-size:13px">📦 Customer & Delivery (Required)</h3>
<div class="field"><input id="cName" placeholder="Full Name *"></div>
<div class="field"><input id="cEmail" type="email" placeholder="Email *"></div>
<div class="field"><input id="cPhone" placeholder="Phone * 072..."></div>
<div class="field"><textarea id="cAddr" placeholder="Delivery Address * House, Street, City"></textarea></div>
<div id="cartInfo" style="font-size:12px;margin-top:8px;color:#0d3d2e;font-weight:800">Fill info above before Pay - Pi Only</div>
</div>

<script>
let mode=localStorage.getItem('marbleNet')||'test', logged=false, piUser=null;
function slog(m,c){let e=document.getElementById('log');e.style.display='block';e.style.background=c||'#fff3cd';e.style.color='#000';e.innerText=m;setTimeout(()=>e.style.display='none',10000);}

// INIT PI CORRECTLY
function initPi(){
 try{
  if(typeof Pi==='undefined'){document.getElementById('piStatus').innerText='Open in Pi Browser';return false;}
  Pi.init({version:"2.0",sandbox:mode==='test'});
  document.getElementById('piStatus').innerText="Pi Ready "+mode.toUpperCase()+" - Tap LOGIN";
  document.getElementById('t').checked=mode==='test';
  document.getElementById('m').checked=mode==='main';
  return true;
 }catch(e){document.getElementById('piStatus').innerText="Pi init error"; return false;}
}
setTimeout(initPi,800);

function setNet(){
 mode=document.getElementById('t').checked?'test':'main';
 localStorage.setItem('marbleNet',mode);
 initPi();
 logged=false; piUser=null;
 document.getElementById('lb').style.display='inline-block';
 document.getElementById('li').style.display='none';
 document.getElementById('lb').innerText="🔐 LOGIN WITH PI";
 slog("Switched to "+mode.toUpperCase()+" - Login again","#fff3cd");
 render();
}

const PRODS=[
{n:"White Pearl 20L",p:2.2,img:"IMG-20260925-WA5227.jpg"},
{n:"Black Onyx 20L",p:2.5,img:"IMG-20260925-WA2658.jpg"},
{n:"Beige Cream 20L",p:2.2,img:"IMG-20260925-WA3167.jpg"},
{n:"Grey Stone 20L",p:2.2,img:"IMG-20260925-WA3781.jpg"},
{n:"Clear Topcoat 20L",p:1.8,img:"IMG-20260925-WA5601.jpg"},
{n:"Floor Primer 20L",p:1.2,img:"IMG-20260925-WA6796.jpg"},
{n:"Hardener 5L",p:1,img:"IMG-20260925-WA2895.jpg"},
{n:"Roller Set",p:0.5,img:"IMG-20260925-WA2619.jpg"},
{n:"Mixing Tool",p:0.4,img:"IMG-20260925-WA0854.jpg"},
{n:"Spiked Shoes",p:0.6,img:"IMG-20260925-WA3048.jpg"},
{n:"Squeegee",p:0.3,img:"IMG-20260925-WA5944.jpg"},
{n:"Pigment Pack",p:0.8,img:"IMG-20260925-WA2188.jpg"},
{n:"Anti-Slip 1L",p:0.3,img:"IMG-20260925-WA6227.jpg"},
{n:"Flakes 5LB",p:0.9,img:"IMG-20260925-WA9802.jpg"},
{n:"Crack Filler 2L",p:0.7,img:"IMG-20260925-WA1894.jpg"},
{n:"Polishing Pad",p:0.6,img:"IMG-20260925-WA5637.jpg"}
];

function render(){
 let h="";
 PRODS.forEach(x=>{
  let price = mode==='test'? x.p : (x.p*0.5).toFixed(2);
  h+=`<div class="card"><div class="imgBox"><img src="./${x.img}" onerror="this.src='./images/${x.img}'" onerror="this.src='https://via.placeholder.com/300x150/0d3d2e/ffffff?text=${encodeURIComponent(x.n)}'"></div><div class="box"><div style="font-size:11px;font-weight:800;height:28px;overflow:hidden">${x.n}</div><div class="price">π ${price}</div><button class="btn" onclick="pay(${price},'${x.n}')">💜 Pay π ${price}</button></div></div>`;
 });
 document.getElementById('g').innerHTML=h;
}
render();

// FIXED INCOMPLETE HANDLER - THIS WAS YOUR BUG
async function onIncompletePaymentFound(payment){
  slog("Found pending "+payment.identifier+" clearing...","#fff3cd");
  try{
    await fetch('/api/complete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paymentId:payment.identifier,txid:payment.transaction?payment.transaction.txid:''})});
  }catch(e){}
  try{
    await fetch('/api/approve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paymentId:payment.identifier})});
  }catch(e){}
  slog("Pending cleared - Login again","#c8e6c9");
}

function getCust(){let n=document.getElementById('cName').value.trim(),e=document.getElementById('cEmail').value.trim(),ph=document.getElementById('cPhone').value.trim(),a=document.getElementById('cAddr').value.trim(); if(!n||!e||!ph||!a){alert("Fill Name, Email, Phone, Address first"); return null;} return {name:n,email:e,phone:ph,addr:a};}

async function login(){
 if(typeof Pi==='undefined'){slog("Open in Pi Browser App","#f8d7da");return;}
 document.getElementById('lb').innerText="⏳ Connecting...";
 try{
  // CORRECT FORMAT: second param is FUNCTION not object
  const auth = await Pi.authenticate(['username','payments'], onIncompletePaymentFound);
  logged=true; piUser=auth.user;
  document.getElementById('lb').style.display='none';
  document.getElementById('li').style.display='block';
  document.getElementById('li').innerHTML='✅ @'+auth.user.username+' - '+mode.toUpperCase();
  slog("✅ Logged in @"+auth.user.username,"#c8e6c9");
 }catch(err){
  document.getElementById('lb').innerText="🔐 LOGIN WITH PI";
  slog("Login failed: "+(err.message||"Open in Pi Browser")+" - Try Mainnet","#f8d7da");
  console.log(err);
 }
}

function pay(amount,memo){
 let cust=getCust(); if(!cust) return;
 if(!logged||!piUser){alert("LOGIN WITH PI first inside Pi Browser"); return;}
 if(typeof Pi==='undefined'){alert("Open in Pi Browser");return;}
 slog("Creating π "+amount+" - You have 60s to confirm in wallet...","#fff3cd");
 Pi.createPayment({amount:parseFloat(amount),memo:memo.slice(0,80),metadata:{customer:cust,network:mode,memo:memo,product:memo}},{
  onReadyForServerApproval:(id)=>{
   slog("Approving "+id.slice(0,8)+"... DO NOT CLOSE","#fff3cd");
   fetch('/api/approve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paymentId:id,network:mode})}).then(r=>r.json()).then(()=>{slog("✅ Approved - Open Pi Wallet NOW to confirm","#c8e6c9");}).catch(()=>{slog("⚠️ Backend /api/approve missing - Add PI_API_KEY in Vercel","#f8d7da");});
  },
  onReadyForServerCompletion:(id,txid)=>{
   slog("✅ PAID π "+amount+" TX:"+txid,"#c8e6c9");
   fetch('/api/complete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paymentId:id,txid:txid,network:mode,customer:cust})}).then(()=>{}).catch(()=>{});
   alert("SUCCESS π "+amount+"\n"+memo+"\nTX:"+txid+"\nWe will deliver to "+cust.addr+"\nCall: "+cust.phone);
  },
  onCancel:()=>slog("Payment cancelled","#f8d7da"),
  onError:(e)=>{slog("Error: "+e.message+" - Try again","#f8d7da"); console.log(e);}
 });
}

// save customer
["cName","cEmail","cPhone","cAddr"].forEach(id=>{let v=localStorage.getItem(id); if(v)document.getElementById(id).value=v; document.getElementById(id).addEventListener('input',e=>localStorage.setItem(id,e.target.value));});
</script></body></html>
