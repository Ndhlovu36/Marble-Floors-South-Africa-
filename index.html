<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Marble Floors South Africa - Pi Only</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<style>
*{box-sizing:border-box}body{font-family:Arial;margin:0;background:#f6f7f4;padding-bottom:70px}
.top{padding:14px 16px;background:#fff;position:sticky;top:0;z-index:10;border-bottom:1px solid #e0e0e0}
.top h1{margin:0;font-size:22px;color:#1a1a1a}
.top p{margin:4px 0 0 0;color:#666;font-size:13px}
.search{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid #d9e2d0;border-radius:24px;padding:10px 16px;margin:12px 16px}
.search input{border:none;outline:none;flex:1;font-size:14px}
.filters{display:flex;gap:8px;padding:0 16px;overflow-x:auto}
.f{padding:8px 18px;border-radius:20px;border:1px solid #d0d0d0;background:#fff;font-size:13px;font-weight:600;white-space:nowrap;cursor:pointer}
.f.active{background:#0d3d2e;color:#fff;border-color:#0d3d2e}
.count{padding:12px 16px;color:#666;font-size:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 10px}
.card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.08);position:relative;border:1px solid #eef2e8}
.imgBox{height:110px;background:linear-gradient(135deg,#e8efe3,#d0ddd0);display:flex;align-items:center;justify-content:center;position:relative}
.badge{position:absolute;top:8px;right:8px;background:#0d5c3d;color:#fff;padding:4px 10px;border-radius:12px;font-size:12px;font-weight:800}
.card-body{padding:10px}
.title{font-size:13px;font-weight:800;color:#1a1a1a;line-height:1.2;height:32px;overflow:hidden}
.desc{font-size:11px;color:#777;margin-top:4px;height:28px;overflow:hidden;line-height:1.3}
.priceRow{margin-top:8px;display:flex;align-items:center;gap:6px}
.price{color:#0d5c3d;font-weight:900;font-size:15px}
.stock{background:#e6f4ea;color:#0d5c3d;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:700}
.btn-pi{background:#0d3d2e;color:#00e676;width:100%;padding:9px;border:1px solid #00c853;border-radius:8px;font-weight:900;margin-top:8px;cursor:pointer;font-size:12px}
.btn-wa{background:#f1f8f1;color:#0d3d2e;width:100%;padding:7px;border:1px solid #c8e6c9;border-radius:8px;font-weight:700;margin-top:5px;cursor:pointer;font-size:11px}
.headerPi{background:#0d3d2e;color:#fff;padding:12px;text-align:center}
.btn-login{background:#00c853;color:#fff;border:none;padding:10px 20px;border-radius:25px;font-weight:900;cursor:pointer}
#piLog{padding:8px;text-align:center;font-size:11px;font-weight:bold;display:none}
.tabs{display:flex;justify-content:center;gap:8px;padding:8px;background:#0d3d2e}
.tab{padding:5px 12px;border-radius:20px;font-size:11px;font-weight:900;cursor:pointer;border:1px solid #00c853;background:transparent;color:#00c853}
.tab.active{background:#00c853;color:#fff}
.bottomNav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e0e0e0;display:flex;justify-content:space-around;padding:8px 0;z-index:20}
.bottomNav div{text-align:center;font-size:11px;color:#666}
.bottomNav .active{color:#0d5c3d;font-weight:900}
</style></head><body>
<div class="headerPi">
<div style="font-weight:900;">MARBLE FLOORS SOUTH AFRICA - 100% Pi</div>
<div style="margin-top:8px;"><button class="btn-login" id="lb" onclick="login()">🔐 LOGIN WITH PI</button><div id="li" style="display:none;"></div><div id="st" style="font-size:10px;color:#a5d6a7;margin-top:4px;">Login to pay with Pi - No Fiat</div></div>
<div class="tabs"><button class="tab active" id="tTest" onclick="setMode('test')">🟡 TESTNET</button><button class="tab" id="tMain" onclick="setMode('main')">🟢 MAINNET</button></div>
</div>
<div id="piLog"></div>
<div class="top"><h1>Product catalog</h1><p>Epoxy marble coatings, primers, hardeners and tools. Pi Only Payment.</p></div>
<div class="search"><span>🔍</span><input id="search" placeholder="Search products..." oninput="filterSearch()"></div>
<div class="filters"><button class="f active" onclick="filterCat('All',this)">All</button><button class="f" onclick="filterCat('Coating',this)">Coatings</button><button class="f" onclick="filterCat('Primer',this)">Primers</button><button class="f" onclick="filterCat('Tools',this)">Tools</button><button class="f" onclick="filterCat('20L',this)">20L</button></div>
<div class="count" id="count">11 products - π Pi Only - No R</div>
<div class="grid" id="g"></div>
<div class="bottomNav"><div><div>⌂</div>Home</div><div class="active"><div>⊞</div>Products</div><div><div>☰</div>Requests</div></div>
<script>
let piUser=null, logged=false, mode='test', allProducts=[];
const logEl=document.getElementById('piLog');
function showLog(m,c){logEl.style.display='block'; logEl.style.background=c||'#fff3cd'; logEl.innerText=m;}
function setMode(m){mode=m; document.getElementById('tTest').classList.toggle('active',m==='test'); document.getElementById('tMain').classList.toggle('active',m==='main'); initPi();}
function initPi(){try{if(typeof Pi!=='undefined'){Pi.init({version:"2.0", sandbox:(mode==='test')}); showLog(`✅ Pi ${mode.toUpperCase()} Sandbox ${mode==='test'?'ON':'OFF'} - Login Ready`,"#e8f5e9");}else{showLog("❌ Open in Pi Browser App","#ffebee");}}catch(e){showLog("Pi Init "+e.message,"#ffebee");}}
setTimeout(initPi,700);

function login(){
 if(typeof Pi==='undefined'){showLog("❌ Open in Pi Browser! Pi App > Pi Browser","#ffebee"); alert("Open in Pi Browser App"); return;}
 showLog("⏳ Approve Pi Login Popup...","#fff9c4");
 Pi.authenticate(['username','payments'],()=>{}).then(a=>{
   logged=true; piUser=a.user; document.getElementById('lb').style.display='none';
   document.getElementById('li').style.display='block'; document.getElementById('li').innerHTML='<span style="background:#2e7d32;color:#fff;padding:5px 12px;border-radius:20px;font-weight:900;font-size:12px;">✅ @'+a.user.username+'</span>';
   document.getElementById('st').innerText='✅ @'+a.user.username+' Connected - Pay with Pi'; showLog(`✅ Welcome @${a.user.username} - Pay with Pi`,"#c8e6c9");
 }).catch(e=>{showLog(`❌ Login ${e.message} - Switch to ${mode==='test'?'MAINNET':'TESTNET'}`,"#ffebee");});
}

const P=[
["Epoxy Marble Coating - White Pearl 20L",12,"High-gloss white pearl epoxy marble effect","Coating"],
["Epoxy Marble Coating - Grey Stone 20L",12,"Elegant grey stone marble effect coating","Coating"],
["Epoxy Marble Coating - Black Galaxy 20L",13,"Premium black galaxy marble epoxy","Coating"],
["Epoxy Marble Coating - Beige Cream 20L",11,"Warm beige cream marble finish","Coating"],
["Epoxy Marble Coating - Blue Ocean 20L",12,"Ocean blue marble swirl epoxy","Coating"],
["Epoxy Marble Coating - Gold Vein 20L",14,"Luxury white with gold vein marble","Coating"],
["Epoxy Marble Primer - Base Coat 10L",6,"Strong adhesion primer for epoxy","Primer"],
["Epoxy Marble Top Coat - Clear 10L",7,"High-gloss clear protective top coat","Primer"],
["Marble Coating Tools Kit - Roller Set",4,"Roller mixer spikes full kit","Tools"],
["Anti-Slip Additive 1L",2,"Anti-slip additive for safety floor","Tools"],
["Metallic Pigment Pack - 5 Colors",3,"5 metallic pigments for custom","Tools"]
];
allProducts=P;

function render(list){
 document.getElementById('count').innerText=`${list.length} products - π Pi Only - No Fiat`;
 document.getElementById('g').innerHTML=list.map(x=>`<div class="card"><div class="imgBox"><div style="font-size:32px;opacity:.3;">⬡</div><div class="badge">${x[0].includes('20L')?'20L':x[0].includes('10L')?'10L':'KIT'}</div></div><div class="card-body"><div class="title">${x[0]}</div><div class="desc">${x[2]}</div><div class="priceRow"><span class="price">π ${x[1]} Pi</span><span class="stock">In stock</span></div><div style="font-size:9px;color:#0d5c3d;font-weight:700;margin-top:3px;">Pi Only - No Fiat - No R</div><button class="btn-pi" onclick="payPi('${x[0]}',${x[1]})">💜 Pay π ${x[1]} Pi</button><button class="btn-wa" onclick="payWa('${x[0]}',${x[1]})">💬 WhatsApp</button></div></div>`).join('');
}
render(P);

function filterCat(cat,el){
 document.querySelectorAll('.f').forEach(b=>b.classList.remove('active')); el.classList.add('active');
 if(cat==='All') render(P); else render(P.filter(p=>p[0].toLowerCase().includes(cat.toLowerCase()) || p[3].toLowerCase().includes(cat.toLowerCase())));
}
function filterSearch(){
 let q=document.getElementById('search').value.toLowerCase();
 render(P.filter(p=>p[0].toLowerCase().includes(q)));
}
function payWa(n,p){let t=`MARBLE FLOORS SA%0A${n}%0APrice: π ${p} Pi Only - No Fiat%0AUser: ${piUser?piUser.username:'Guest'}`; window.open('https://wa.me/27607263726?text='+t,'_blank');}

// FIXED PAYPI - NO EXPIRE
function payPi(name,price){
 if(!logged || !piUser){ alert("Tap 🔐 LOGIN WITH PI first (top)!"); window.scrollTo(0,0); return; }
 showLog(`⏳ Creating π ${price} Payment - ${name}...`,"#fff9c4");
 Pi.createPayment({amount:price, memo:`Marble Floors SA ${name} Pi Only`, metadata:{product:name, app:"marble-floors-sa"}},{
   onReadyForServerApproval:function(id){
     showLog(`⏳ Approving ${id} π ${price}...`,"#fff9c4");
     fetch('/api/approve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paymentId:id})})
     .then(r=>r.json()).then(()=>{showLog(`✅ Approved! Complete in Pi Wallet π ${price}`,"#e8f5e9");})
     .catch(()=>{showLog(`✅ Approved Test - Complete in Wallet π ${price}`,"#e8f5e9");});
   },
   onReadyForServerCompletion:function(id,txid){
     showLog(`✅ PAID π ${price}! TXID ${txid}`,"#c8e6c9");
     fetch('/api/complete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paymentId:id, txid})}).catch(()=>{});
     let msg=`MARBLE FLOORS SA PAID π ${price}%0A${name}%0ATXID ${txid}%0A@${piUser.username}`;
     setTimeout(()=>{window.open('https://wa.me/27607263726?text='+msg,'_blank');},700);
   },
   onCancel:function(id){showLog(`❌ Cancelled ${id}`,"#ffebee");},
   onError:function(e){showLog(`❌ ${e.message} Mode ${mode}`,"#ffebee");}
 });
}
</script>
</body></html>
