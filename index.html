<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marble Floors South Africa</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial;background:#fcfaf8;color:#222}
.header{background:linear-gradient(135deg,#4a148c,#7b1fa2,#6a1b9a);color:white;padding:20px 12px;text-align:center;position:sticky;top:0;z-index:10;border-bottom:3px solid #FFD700}
.header h1{font-size:22px;font-weight:900;letter-spacing:1px;color:#FFD700;text-shadow:0 1px 3px rgba(0,0,0,0.5);}
.header p{color:#e1bee7;font-size:12px;margin-top:5px}
.gold-badge{background:#FFD700;color:#4a148c;display:inline-block;padding:5px 14px;border-radius:20px;font-size:11px;font-weight:900;margin-top:10px}
.login-bar{background:#f3e5f5;padding:12px;text-align:center;border-bottom:2px solid #ce93d8}
.login-btn{background:#4a148c;color:#FFD700;border:2px solid #FFD700;padding:12px 22px;border-radius:25px;font-weight:900;font-size:13px;cursor:pointer}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px;min-height:400px}
.card{background:white;border-radius:14px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.1);border:1px solid #e1bee7}
.card img{width:100%;height:130px;object-fit:cover;background:#eee}
.card-body{padding:10px}
.cat{font-size:9px;color:#7b1fa2;font-weight:900}
.name{font-size:13px;font-weight:800;color:#4a148c;margin:3px 0}
.desc{font-size:11px;color:#666;margin-bottom:6px}
.price{font-size:16px;font-weight:900;color:#4a148c}
.btn{width:100%;background:#4a148c;color:#FFD700;border:1px solid #FFD700;padding:9px;border-radius:8px;font-weight:900;font-size:12px;margin-top:6px;cursor:pointer}
</style>
</head>
<body>
<div class="header">
<h1>MARBLE FLOORS SOUTH AFRICA</h1>
<p>Premium Marble • Granite • Travertine • Pay with Pi</p>
<div class="gold-badge">✨ 12 PREMIUM PRODUCTS IN STOCK ✨</div>
</div>
<div class="login-bar">
<button class="login-btn" id="piLoginBtn">🔐 LOGIN WITH PI - TAP HERE</button>
<div id="userInfo" style="display:none;font-weight:900;color:#2e7d32;margin-top:8px;"></div>
<div id="status" style="font-size:11px;color:#4a148c;margin-top:6px;">✅ Ready - 12 products loaded</div>
</div>
<div style="display:flex;gap:8px;padding:10px;background:white;">
<input id="wa" value="0607263726" style="flex:1;padding:11px;border:2px solid #ce93d8;border-radius:8px;">
<input id="loc" value="Johannesburg" style="flex:1;padding:11px;border:2px solid #ce93d8;border-radius:8px;">
</div>
<div class="grid" id="grid"></div>
<script>
// PRODUCTS LOAD IMMEDIATELY - NO WAIT FOR PI SDK
const products=[
{name:"Carrara White 60x60",price:18,old:24,cat:"CLASSIC WHITE",desc:"Polished white Italian look",img:"https://images.unsplash.com/photo-1618221469555-7f3ad97540d6?w=400"},
{name:"Black Marquina",price:22,old:30,cat:"LUXURY BLACK",desc:"Deep black white veins gloss",img:"https://images.unsplash.com/photo-1600585154340-be6161a56a0c?w=400"},
{name:"Grey Emperador",price:16,old:21,cat:"MODERN GREY",desc:"Warm grey living rooms",img:"https://images.unsplash.com/photo-1586105251261-72a756497a11?w=400"},
{name:"Calacatta Gold",price:28,old:35,cat:"GOLD LUXURY",desc:"White gold veins luxury",img:"https://images.unsplash.com/photo-1616047006789-b7af5afb8c20?w=400"},
{name:"Travertine Beige",price:14,old:18,cat:"TRAVERTINE",desc:"Natural beige outdoor",img:"https://images.unsplash.com/photo-1600585154526-990dced4db0d?w=400"},
{name:"Statuario White",price:26,old:33,cat:"STATUARIO",desc:"Bright white grey veins",img:"https://images.unsplash.com/photo-1618221195710-dd6b41faaea6?w=400"},
{name:"Verde Green",price:24,old:32,cat:"GREEN MARBLE",desc:"Exotic green statement",img:"https://images.unsplash.com/photo-1600210492486-724fe5c67fb0?w=400"},
{name:"Crema Marfil",price:15,old:19,cat:"CREMA",desc:"Soft cream popular SA",img:"https://images.unsplash.com/photo-1616046229478-9901c5536a45?w=400"},
{name:"Black+White Border",price:20,old:26,cat:"BORDER",desc:"Black field white border",img:"https://images.unsplash.com/photo-1581858726788-75bc0f6a952d?w=400"},
{name:"Arabescato Slab",price:32,old:40,cat:"SLAB",desc:"Large dramatic veins",img:"https://images.unsplash.com/photo-1618221469555-7f3ad97540d6?w=400"},
{name:"Black Galaxy Granite",price:12,old:16,cat:"GRANITE",desc:"Hard wearing granite",img:"https://images.unsplash.com/photo-1600585154084-4e5fe7c39198?w=400"},
{name:"Wood Look Beige",price:13,old:17,cat:"WOOD MARBLE",desc:"Wood effect modern",img:"https://images.unsplash.com/photo-1600585154340-be6161a56a0c?w=400"}
];
document.getElementById('grid').innerHTML=products.map(p=>`<div class="card"><img src="${p.img}"><div class="card-body"><div class="cat">${p.cat}</div><div class="name">${p.name}</div><div class="desc">${p.desc}</div><div><span class="price">${p.price} Pi</span> <span style="font-size:11px;color:#999;text-decoration:line-through;">${p.old} Pi</span></div><button class="btn" onclick="buy('${p.name}',${p.price})">SALES • Buy ${p.price} Pi</button></div></div>`).join('');

// LOGIN BUTTON - WORKS EVEN IF PI SDK STUCK
let currentUser=null;
document.getElementById('piLoginBtn').onclick=function(){
  if(typeof Pi==='undefined' || !Pi){
    currentUser={username:'MarbleBuyer'}; 
    this.style.display='none';
    document.getElementById('userInfo').style.display='block';
    document.getElementById('userInfo').innerText='✅ Logged (Demo) - Now Buy';
    document.getElementById('status').innerText='Demo mode - tap SALES button below';
    return;
  }
  try{ Pi.init({version:"2.0", sandbox:false}); }catch(e){}
  Pi.authenticate(['username','payments'], function(a){ currentUser=a.user; document.getElementById('piLoginBtn').style.display='none'; document.getElementById('userInfo').style.display='block'; document.getElementById('userInfo').innerText='✅ @'+a.user.username; }, function(e){ currentUser={username:'Guest'}; document.getElementById('piLoginBtn').style.display='none'; document.getElementById('userInfo').style.display='block'; document.getElementById('userInfo').innerText='✅ Guest Login'; });
};

function buy(name,price){
 const wa=document.getElementById('wa').value||'0607263726';
 const loc=document.getElementById('loc').value||'Johannesburg';
 if(!currentUser){ alert('Tap LOGIN WITH PI first at top!'); return; }
 // MOVE WITHOUT OPENING - Direct WhatsApp checkout (works everywhere)
 const text=`Hi Marble Floors SA! I want to buy: ${name} for ${price} Pi. WhatsApp: ${wa}, Location: ${loc}, Pi User: ${currentUser.username}`;
 window.open(`https://wa.me/27607263726?text=${encodeURIComponent(text)}`,'_blank');
}
</script>
</body>
</html>
