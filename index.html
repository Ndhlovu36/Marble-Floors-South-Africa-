<div class="grid" id="grid"></div>

<script>
let currentUser=null;
let PiSDKReady=false;

// FIX DEAD LOGIN BUTTON - wait for SDK
function initPi(){
  try{
    if(typeof Pi!=='undefined'){
      Pi.init({version:"2.0", sandbox:false});
      PiSDKReady=true;
      document.getElementById('status').innerHTML='✅ Pi SDK Ready - Tap Login button above';
      document.getElementById('status').style.color='#2e7d32';
    } else {
      document.getElementById('status').innerHTML='⚠️ Open in Pi Browser for Pi Login (Chrome = demo login)';
      // still make button work in demo
      PiSDKReady=false;
    }
  }catch(e){
    document.getElementById('status').innerText='SDK Error: '+e.message;
  }
}
setTimeout(initPi, 800);
setTimeout(initPi, 2000); // retry

document.getElementById('piLoginBtn').addEventListener('click', function(){
  console.log('Login clicked, Pi defined?', typeof Pi);
  if(typeof Pi==='undefined'){
    // DEMO LOGIN - button works even without Pi
    currentUser={username:'DemoBuyer_Marble'};
    document.getElementById('piLoginBtn').style.display='none';
    document.getElementById('userInfo').style.display='inline-block';
    document.getElementById('userInfo').innerText='✅ Logged (Demo): DemoBuyer_Marble - Now you can Buy';
    document.getElementById('status').innerText='Demo mode active - you can test buying';
    alert('Demo login success! Now tap any SALES button below.');
    return;
  }
  document.getElementById('status').innerText='Logging in with Pi...';
  Pi.authenticate(['username','payments'],
    function(auth){
      currentUser=auth.user;
      document.getElementById('piLoginBtn').style.display='none';
      document.getElementById('userInfo').style.display='inline-block';
      document.getElementById('userInfo').innerText='✅ @'+auth.user.username+' Logged';
      document.getElementById('status').innerText='Welcome @'+auth.user.username+' - You can now buy';
    },
    function(error){
      document.getElementById('status').innerText='Auth failed: '+error+' - using demo';
      currentUser={username:'GuestMarble'};
      document.getElementById('piLoginBtn').style.display='none';
      document.getElementById('userInfo').style.display='inline-block';
      document.getElementById('userInfo').innerText='✅ Guest Login Active';
    }
  );
});
