<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Marble Floors SA - Pay with Pi</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<style>
body{font-family:Arial;padding:20px;max-width:600px;margin:auto}
button{padding:12px 18px;margin:5px;font-weight:bold;cursor:pointer}
#userInfo{color:green;font-weight:bold;font-size:18px}
.footer{margin-top:40px;padding-top:20px;border-top:1px solid #ccc}
</style>
</head>
<body>

<h1>My Products</h1>
<p>Price: 1 Pi</p>
<p id="userInfo"></p>

<button onclick="loginWithPi()">Login with Pi</button>
<button onclick="payWithPi('Marble Floor Quote')">Pay with Pi</button>

<div class="footer">
<p>© 2026 MARBLE FLOORS SOUTH AFRICA</p>
<p><a href="privacy.html">Privacy</a> | <a href="terms.html">Terms</a> | <a href="support.html">Support</a></p>
<p>Email: marblefloorssa@gmail.com</p>
<p>CA | Johannesburg | Cape Town | Bloemfontein | Luxury Floors</p>
</div>

<script>
const Pi = window.Pi;
Pi.init({ version: "2.0", sandbox: false });
let user = null;

async function loginWithPi(){
 try{
  const scopes = ['username','payments'];
  const auth = await Pi.authenticate(scopes, onIncompletePaymentFound);
  user = auth.user;
  document.getElementById('userInfo').innerText = "Welcome "+user.username+" ✅ Pi Connected - Ready to Order";
 }catch(e){
  alert("Please open in Pi Browser: "+e.message);
 }
}

function onIncompletePaymentFound(payment){
 console.log("Incomplete payment found:", payment);
}

async function payWithPi(item){
 if(!user){
  alert("Please Login with Pi first!");
  return;
 }
 try{
  const paymentData = {
   amount: 1,
   memo: "Marble Floor - "+item,
   metadata: { item: item }
  };

  const callbacks = {
   onReadyForServerApproval: function(paymentId){
    console.log("Ready for approval: "+paymentId);
   },
   onReadyForServerCompletion: function(paymentId, txid){
    alert("Thank you! Payment Complete! TX: "+txid);
   },
   onCancel: function(paymentId){
    alert("Payment Cancelled");
   },
   onError: function(error, payment){
    alert("Payment Error: "+error.message);
   }
  };

  await Pi.createPayment(paymentData, callbacks);

 }catch(e){
  alert("Error: "+e.message);
 }
}
</script>

</body>
</html>
