<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Marble Floors SA - Pi Only - FIXED</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<style>*{box-sizing:border-box}body{font-family:Arial;margin:0;background:#f6f7f4;padding-bottom:115px}.headerPi{background:#0d3d2e;color:#fff;padding:12px;text-align:center;position:sticky;top:0;z-index:10}.btn-login{background:#00c853;color:#fff;border:none;padding:10px 22px;border-radius:25px;font-weight:900}#piLog{padding:10px;text-align:center;font-size:11px;font-weight:bold;display:none;position:sticky;top:0;z-index:20}.net{background:#102a22;color:#fff;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;font-size:12px}.count{padding:10px 12px;color:#555;font-size:12px;display:flex;justify-content:space-between}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 10px}.card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.08);border:1px solid #eef2e8}.imgBox{height:150px;background:#eee;position:relative;overflow:hidden}.imgBox img{width:100%;height:100%;object-fit:cover;display:block}.badge{position:absolute;top:8px;right:8px;background:#0d5c3d;color:#fff;padding:4px 10px;border-radius:12px;font-size:12px;font-weight:800}.card-body{padding:10px}.title{font-size:11px;font-weight:800;height:32px;overflow:hidden}.stock{background:#e6f4ea;color:#0d5c3d;padding:3px 8px;border-radius:10px;font-size:9px;font-weight:700}.qtyBox{display:flex;align-items:center;gap:5px;margin-top:7px;background:#f1f8f1;padding:4px;border-radius:8px}.qtyBox button{width:26px;height:26px;border-radius:6px;border:1px solid #0d5c3d;background:#fff;font-weight:900}.qtyBox input{width:32px;text-align:center;border:1px solid #c8e6c9;border-radius:4px;padding:3px;font-weight:800}.priceEdit{width:58px;border:1px dashed #00c853;border-radius:6px;padding:3px;text-align:center;font-weight:900;color:#0d5c3d}.btn-pi{background:#0d3d2e;color:#00e676;width:100%;padding:8px;border:1px solid #00c853;border-radius:8px;font-weight:900;margin-top:6px;font-size:11px}.btn-add{background:#e8f5e9;color:#0d3d2e;width:100%;padding:7px;border:1px solid #0d5c3d;border-radius:8px;font-weight:800;margin-top:5px;font-size:11px}.panel{background:#fff;margin:12px;border-radius:16px;padding:14px;box-shadow:0 2px 8px rgba(0,0,0,.08)}.field{margin-bottom:10px}.field label{font-size:11px;font-weight:800;color:#0d3d2e;display:block;margin-bottom:3px}.field input,.field textarea{width:100%;padding:10px;border:1px solid #c8e6c9;border-radius:8px;font-size:13px}.bar{position:fixed;bottom:0;left:0;right:0;background:#0d3d2e;color:#fff;padding:12px;display:flex;justify-content:space-between;align-items:center;z-index:20}.fallback{height:150px;display:flex;align-items:center;justify-content:center;background:#0d3d2e;color:#00e676;font-weight:800;text-align:center;padding:8px}</style></head><body>
<div class="headerPi"><div style="font-weight:900;">MARBLE FLOORS SA - Pi Only - FIXED ✅</div><div style="margin-top:8px;"><button class="btn-login" id="lb" onclick="login()">🔐 LOGIN WITH PI</button><div id="li" style="display:none;"></div></div></div>
<div class="net"><div><b>Network:</b> <input type="radio" name="net" id="test" value="test" checked onchange="switchNet()"><label for="test">Testnet</label> <input type="radio" name="net" id="main" value="main" onchange="switchNet()"><label for="main">Mainnet 50% OFF</label></div><div id="ns" style="background:#ff9800;padding:4px 8px;border-radius:10px;font-size:10px;font-weight:800">TESTNET</div></div>
<div id="piLog"></div><div class="count"><span>16 Products - FIXED No Expiry</span><span>✏️ Tap price to edit</span></div><div class="grid" id="g"></div>
<div class="panel"><h3 style="margin:0 0 10px 0;font-size:13px">📦 Customer & Delivery Details (Required)</h3><div class="field"><label>Customer Name *</label><input id="cName" placeholder="Full Name"></div><div class="field"><label>Customer Email *</label><input id="cEmail" type="email" placeholder="you@gmail.com"></div><div class="field"><label>Customer Phone *</label><input id="cPhone" placeholder="072 123 4567"></div><div class="field"><label>Delivery Address *</label><textarea id="cAddr" placeholder="House No, Street, Suburb, City, Province"></textarea></div><h3 style="margin-top:14px;font-size:13px">🛒 Your Cart</h3><div id="cartList" style="font-size:12px;color:#888">No products added yet.</div><div style="font-weight:900;display:flex;justify-content:space-between;margin-top:10px"><span>Total:</span><span id="cartTotal">π 0 Pi</span></div><button class="btn-pi" style="padding:12px;margin-top:10px;font-size:13px" onclick="checkout()">💜 PAY WITH PI - COMPLETE ORDER</button><button class="btn-add" onclick="clearCart()">🗑 Clear Cart</button></div><div class="bar"><div><div style="font-size:11px;opacity:.8">Cart</div><div id="barCount" style="font-weight:900">0 items - π 0</div></div><button onclick="document.getElementById('cName').scrollIntoView({behavior:'smooth'})" style="background:#00c853;color:#fff;border:none;padding:10px 18px;border-radius:20px;font-weight:900">VIEW CART</button></div>
<script>
let piUser=null,logged=false,mode='test',cart=[];
function showLog(m,c){let e=document.getElementById('piLog');e.style.display='block';e.style.background=c||'#fff3cd';e.style.color='#000';e.innerText=m;setTimeout(()=>{e.style.display='none'},8000);}
function initPi(){try{let isTest=document.getElementById('test').checked;mode=isTest?'test':'main';Pi.init({version:"2.0",sandbox:isTest});showLog((isTest?"TESTNET Ready":"MAINNET Ready")+" - Please LOGIN","#e8f5e9");document.getElementById('ns').innerText=isTest?"TESTNET":"MAINNET 50% OFF";document.getElementById('ns').style.background=isTest?"#ff9800":"#00c853";}catch(e){}}setTimeout(initPi,800);
function switchNet(){initPi();P=getPrices();renderGrid();renderCart();showLog("Switched to "+mode.toUpperCase(),"#fff3cd");}
function onIncomplete(p){showLog("Clearing incomplete payment...","#fff3cd");fetch('/api/complete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paymentId:p.identifier,txid:p.transaction?p.transaction.txid:""})}).then(()=>showLog("Cleared - You can pay again","#c8e6c9"));}
function login(){if(typeof Pi==='undefined'){alert("Open in Pi Browser app");return;}document.getElementById('lb').innerText="⏳ Connecting...";Pi.authenticate(['username','payments'],{onIncompletePaymentFound:onIncomplete}).then(a=>{logged=true;piUser=a.user;document.getElementById('lb').style.display='none';document.getElementById('li').style.display='block';document.getElementById('li').innerHTML='✅ @'+a.user.username+' - '+mode.toUpperCase();showLog("Logged as @"+a.user.username,"#c8e6c9");}).catch(e=>{document.getElementById('lb').innerText="🔐 LOGIN WITH PI";showLog("Login failed - Open Pi Browser","#f8d7da");});}
const BASE=[{n:"White Pearl 20L",p:2.2,img:"IMG-20260925-WA5227.jpg"},{n:"Black Onyx 20L",p:2.5,img:"IMG-20260925-WA2658.jpg"},{n:"Beige Cream 20L",p:2.2,img:"IMG-20260925-WA3167.jpg"},{n:"Grey Stone 20L",p:2.2,img:"IMG-20260925-WA3781.jpg"},{n:"Clear Topcoat 20L",p:1.8,img:"IMG-20260925-WA5601.jpg"},{n:"Floor Primer 20L",p:1.2,img:"IMG-20260925-WA6796.jpg"},{n:"Hardener 5L",p:1,img:"IMG-20260925-WA2895.jpg"},{n:"Roller Set",p:0.5,img:"IMG-20260925-WA2619.jpg"},{n:"Mixing Tool",p:0.4,img:"IMG-20260925-WA0854.jpg"},{n:"Spiked Shoes",p:0.6,img:"IMG-20260925-WA3048.jpg"},{n:"Squeegee",p:0.3,img:"IMG-20260925-WA5944.jpg"},{n:"Pigment Pack",p:0.8,img:"IMG-20260925-WA2188.jpg"},{n:"Anti-Slip 1L",p:0.3,img:"IMG-20260925-WA6227.jpg"},{n:"Flakes 5LB",p:0.9,img:"IMG-20260925-WA9802.jpg"},{n:"Crack Filler 2L",p:0.7,img:"IMG-20260925-WA1894.jpg"},{n:"Polishing Pad",p:0.6,img:"IMG-20260925-WA5637.jpg"}];
function getPrices(){return BASE.map(b=>{let pr=b.p;if(mode==='main'){pr=b.p*0.5;if(pr<0.1)pr=0.1;}return{...b,p:Number(pr.toFixed(2))};});}
let P=getPrices();
function renderGrid(){document.getElementById('g').innerHTML=P.map((x,i)=>`<div class="card"><div class="imgBox"><img src="./${x.img}" onerror="this.onerror=null; this.src='./images/${x.img}'; this.onerror=function(){this.style.display='none'; this.nextElementSibling.style.display='flex';}"><div class="fallback" style="display:none">🧱 ${x.n}<br>π ${x.p}</div><div class="badge">π ${x.p}</div></div><div class="card-body"><div class="title">${x.n}</div><div style="margin-top:6px;display:flex;justify-content:space-between;align-items:center"><span style="color:#0d5c3d;font-weight:900">π <input class="priceEdit" value="${x.p}" onchange="updateP(${i},this.value)"></span><span class="stock">In stock</span></div><div class="qtyBox"><button onclick="chQ(${i},-1)">-</button><input id="qty_${i}" value="1" type="number"><button onclick="chQ(${i},1)">+</button><span style="font-size:10px">Qty</span></div><button class="btn-add" onclick="addCart(${i})">➕ Add to Cart
