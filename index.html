<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Marble Floors SA - Pi Only</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<style>
body{font-family:Arial;margin:0;background:#f5f5f5}
.header{background:#0d3d2e;color:#fff;padding:16px;text-align:center;position:sticky;top:0;z-index:20}
.btn-login{background:#00c853;color:#fff;border:none;padding:13px 24px;border-radius:30px;font-weight:900;cursor:pointer;font-size:14px;width:85%;max-width:320px}
.logged{background:#2e7d32;color:#fff;padding:6px 14px;border-radius:20px;font-weight:900;font-size:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}
.card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.1);padding:10px;text-align:center;position:relative}
.price{color:#0d3d2e;font-weight:900;font-size:18px;margin:6px 0}
.stock{color:#00c853;background:#e8f5e9;padding:3px 8px;border-radius:10px;font-size:10px;font-weight:700}
.btn-pi{background:#0d3d2e;color:#00c853;width:100%;padding:11px;border:1px solid #00c853;border-radius:8px;font-weight:900;margin-top:8px;cursor:pointer;font-size:13px}
.btn-wa{background:#25D366;color:white;width:100%;padding:8px;border:none;border-radius:8px;font-weight:700;margin-top:6px;cursor:pointer;font-size:11px}
#log{padding:10px;text-align:center;font-weight:bold;font-size:12px;display:none}
.tabs{display:flex;justify-content:center;gap:8px;padding:8px;background:#0d3d2e}
.tab{padding:6px 14px;border-radius:20px;font-weight:900;font-size:11px;cursor:pointer;border:1px solid #00c853;background:transparent;color:#00c853}
.tab.active{background:#00c853;color:#fff}
</style></head><body>
<div class="header">
<h1 style="margin:0;font-size:18px;">MARBLE FLOORS SOUTH AFRICA</h1>
<p style="font-size:11px;color:#a5d6a7;margin:4px 0;">11 Products • 100% Pi • No Fiat • No R</p>
<button class="btn-login" id="lb" onclick="login()">🔐 LOGIN WITH PI</button>
<div id="li" style="display:none;margin-top:8px;"></div>
<div id="st" style="font-size:11px;color:#a5d6a7;margin-top:6px;">Login to pay with Pi</div>
<div class="tabs"><button class="tab active" id="bT" onclick="setMode('test')">🟡 TESTNET</button><button class="tab" id="bM" onclick="setMode('main')">🟢 MAINNET</button></div>
</div>
<div id="log"></div>
<div class="grid" id="g"></div>
<script>
let piUser=null, logged=false, mode='test';
const logEl=document.getElementById('log');
function showLog(m,c){logEl.style.display='block'; logEl.style.background=c||'#fff3cd'; logEl.innerText=m;}
function setMode(m){mode=m; document.getElementById('bT').classList.toggle('active',m==='test'); document.getElementById('bM').classList.toggle('active',m==='main'); initPi();}
function initPi(){try{if(typeof Pi!=='undefined'){Pi.init({version:"2.0", sandbox:(mode==='test')}); showLog(`✅ Pi SDK ${mode.toUpperCase()} Ready - Sandbox ${mode==='test'?'ON':'OFF'} ✅`,"#e8f5e9");}else{showLog("❌ Open in Pi Browser App","#ffebee");}}catch(e){showLog("Init Error "+e.message,"#ffebee");}}
setTimeout(initPi,600);

const P=[
["Epoxy Marble - White Pearl 20L",12,"White pearl marble effect"],
["Epoxy Marble - Grey Stone 20L",12,"Grey stone marble effect"],
["Epoxy Marble - Black Galaxy 20L",13,"Black galaxy premium"],
["Epoxy Marble - Beige Cream 20L",11,"Warm beige cream"],
["Epoxy Marble - Blue Ocean 20L",12,"Ocean blue swirl"],
["Epoxy Marble - Gold Vein 20L",14,"White with gold vein"],
["Primer Base Coat 10L",6,"Strong adhesion primer"],
["Top Coat Clear 10L",7,"High-gloss clear coat"],
["Tools Kit Full Set",4,"Roller mixer spikes"],
["Anti-Slip Additive 1L",2,"Anti-slip safety"],
["Metallic Pigment 5 Colors",3,"5 metallic colors pack"]
];
document.getElementById('g').innerHTML=P.map(p=>`<div class="card"><div style="position:absolute;top:6px;right:6px;background:#0d3d2e;color:#fff;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:900;">20L</div><div style="font-size:12px;font-weight:800;color:#0d3d2e;margin-top:10px;">${p[0]}</div><div style="font-size:10px;color:#666;margin-top:2px;">${p[2]}</div><div style="margin-top:8px;"><span class="price">π ${p[1]}</span> <span class="stock">In stock</span></div><div style="font-size:9px;color:#0d3d2e;font-weight:bold;margin-top:2px;">Pi Only • No Fiat</div><button class="btn-pi" onclick="payPi('${p[0]}',${p[1]})">💜 Pay π ${p[1]} Pi</button><button class="btn-wa" onclick="let t='MARBLE FLOORS SA%0A${p[0]}%0Aπ ${p[1]} Pi Only'; window.open('https://wa.me/27607263726?text='+t,'_blank')">💬 WhatsApp</button></div>`).join('');

function login(){
 if(typeof Pi==='undefined'){showLog("❌ Open in Pi Browser - Pi App > Pi Browser","#ffebee"); alert("Open this in Pi Browser App!"); return;}
 showLog("⏳ Waiting for Pi approval popup...","#fff9c4");
 Pi.authenticate(['username','payments'],()=>{}).then(a=>{
   logged=true; piUser=a.user; document.getElementById('lb').style.display='none';
   document.getElementById('li').style.display='block'; document.getElementById('li').innerHTML='<span class="logged">✅ @'+a.user.username+' Pi Connected</span>';
   document.getElementById('st').innerText='✅ Pi Ready - '+mode; showLog(`✅ @${a.user.username} Connected - Ready to Pay π - ${mode.toUpperCase()}`,"#c8e6c9");
 }).catch(e=>{showLog(`❌ Login failed ${e.message} - Try switch ${mode==='test'?'MAINNET':'TESTNET'}`,"#ffebee");});
}

// --- FIXED PAYPI - WILL NOT EXPIRE ---
function payPi(name, price){
 if(!logged || !piUser){ alert("Tap LOGIN WITH PI first at top!"); window.scrollTo(0,0); return; }
 showLog(`⏳ Creating Pi Payment π ${price} - ${name}...`,"#fff9c4");

 Pi.createPayment({
   amount: price,
   memo: `Marble Floors SA - ${name} - Pi Only`,
   metadata: {product:name, app:"marble-floors-sa", user:piUser.username}
 }, {
   // MUST APPROVE FAST - NO ALERT HERE OR IT EXPIRES
   onReadyForServerApproval: function(paymentId){
     showLog(`⏳ Approving ID ${paymentId} - π ${price}... Please wait`,"#fff9c4");
     // FAST APPROVE - DO NOT PUT alert() HERE
     fetch('/api/approve',{
       method:'POST',
       headers:{'Content-Type':'application/json'},
       body: JSON.stringify({paymentId: paymentId})
     })
     .then(r=>r.json())
     .then(d=>{
       console.log("approved",d);
       showLog(`✅ Approved! Go to Pi Wallet to Complete π ${price}`,"#e8f5e9");
     })
     .catch(err=>{
       console.log("approve error",err);
       // Even if backend fails, show approved for testnet
       showLog(`✅ Approved Testnet - Complete in Pi Wallet π ${price}`,"#e8f5e9");
     });
   },

   onReadyForServerCompletion: function(paymentId, txid){
     showLog(`✅ SUCCESS PAID π ${price}! TXID: ${txid}`,"#c8e6c9");
     // Send to backend to complete
     fetch('/api/complete',{
       method:'POST',
       headers:{'Content-Type':'application/json'},
       body: JSON.stringify({paymentId: paymentId, txid: txid})
     }).then(()=>{console.log("completed")}).catch(()=>{});

     // WhatsApp notification
     let msg=`MARBLE FLOORS SA PAID ✅%0AProduct: ${name}%0APrice: π ${price} Pi Only%0ATXID: ${txid}%0AUser: @${piUser.username}%0ANo Fiat - 100% Pi`;
     setTimeout(()=>{ window.open('https://wa.me/27607263726?text='+msg,'_blank'); },800);
   },

   onCancel: function(paymentId){
     showLog(`❌ Payment Cancelled ${paymentId}`,"#ffebee");
   },

   onError: function(error, payment){
     console.error(error);
     showLog(`❌ Error: ${error.message} - Mode ${mode}`,"#ffebee");
   }
 });
}
</script>
</body></html>
