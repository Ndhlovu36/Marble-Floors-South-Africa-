<script>
let logged=false, piUser=null, mode='test';
function status(m,c){let e=document.getElementById('piStatus');e.style.display='block';e.style.background=c||'#fff3cd';e.innerText=m;}
function setMode(m){mode=m;document.getElementById('tabTest').classList.toggle('active',m==='test');document.getElementById('tabMain').classList.toggle('active',m==='main');initPi();}
function initPi(){try{Pi.init({version:"2.0",sandbox:(mode==='test')});status(`Pi ${mode.toUpperCase()} Sandbox ${mode==='test'?'ON':'OFF'} ✅`,"#e8f5e9");}catch(e){status("Pi SDK "+e.message,"#ffebee");}}
window.addEventListener('load',()=>{setTimeout(initPi,500);});
function login(){
 if(typeof Pi==='undefined'){status("❌ Open in Pi Browser!","#ffebee");alert("Open in Pi Browser App");return;}
 status("⏳ Approve in Pi Browser...","#fff9c4");
 Pi.authenticate(['username','payments'],()=>{}).then(a=>{
   logged=true; piUser=a.user;
   document.getElementById('lb').style.display='none';
   let d=document.getElementById('li'); d.style.display='block'; d.innerHTML='<span class="logged">✅ @'+a.user.username+'</span>';
   document.getElementById('st').innerText='✅ Pi Ready - π Only';
   status(`✅ @${a.user.username} Connected - Pay with Pi`,"#e8f5e9");
 }).catch(e=>{status("Login failed "+e.message,"#ffebee");});
}
